[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesi-qml"
version = "0.1.0"
description = "Pipeline riproducibile per Quantum Transfer Learning su morfologie galattiche"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Michele Scandone"}
]
keywords = [
  "quantum-machine-learning",
  "quantum-transfer-learning",
  "pennylane",
  "sdss-dr17",
  "galaxy-morphology",
  "pytorch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
]

[project.urls]
Repository = "https://github.com/michelescandone/qtl-galaxy-classification"
Documentation = "https://github.com/michelescandone/qtl-galaxy-classification/tree/main/docs"

[project.optional-dependencies]
quantum = [
  "pennylane==0.42.3",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "nbformat>=5.10,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "quantum: richiede dipendenze quantistiche",
  "integration: test end-to-end",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S102"]
"notebooks/*" = ["E402"]
"heat_map/*" = ["E402"]
