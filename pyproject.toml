[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesi-qml"
version = "0.1.0"
description = "Pipeline riproducibile per Quantum Transfer Learning su morfologie galattiche"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
quantum = [
  "pennylane==0.42.3",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "nbformat>=5.10,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "quantum: richiede dipendenze quantistiche",
  "integration: test end-to-end",
]

[tool.ruff]
line-length = 100
target-version = "py310"
